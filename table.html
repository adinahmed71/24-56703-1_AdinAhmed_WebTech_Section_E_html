<!DOCTYPE html>
<html>
    <head>
	    <title>table</title>
		<style>
		table{
			width:350px;
			height:225px;
			border:2px solid black;
			border-collapse: collapse;
		}
	    th,
		td{
		    border:2px solid black;
		    padding:15px;
		}
		</style>
	</head>
<body>
    <table border="1">
	    <tr>
		    <th>Name</th>
			<th>ID</th>
			<th rowspan="3">ISD</th>
		</tr>
		<tr>
		    <td>A</td>
			<td>10</td>
		</tr>
		<tr>
		    <td>B</td>
		    <td>11</td>
		</tr>

	</table><br>
	<table border="1">
	    <tr>
		    <th>DB</th>
			<th>BC</th>
			<th>CD</th>
			<th>DE</th>
		</tr>
		<tr>
		    <td rowspan="3">
			EF<br>
			ex.
			</td>
			<th colspan="3">GM</th>
		</tr>
		<tr>
		    <td rowspan="2">KL</td>
			<td>MN</td>
			<td rowspan="2">OP</td>
		</tr>
		<tr>
		    <td>NO</td>
		</tr>
	</table>
		
		
		
</body>
</html>
